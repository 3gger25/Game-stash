instructions: Download and open this HTML file in your web browser to play the game.
instructions(again): Click on the red dot to score points.
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web.html</title>
    <style>
        body {
            margin: 0;
            background-color: #222;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin-bottom: 10px;
        }
        canvas {
            border: 4px solid #fff;
            background-color: #111;
            cursor: crosshair;
        }
    </style>
</head>
<body>

    <h1>Score: <span id="scoreBoard">0</span></h1>
    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <script>
       
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreBoard = document.getElementById('scoreBoard');

        
        let score = 0;
        let target = {
            x: Math.random() * (canvas.width - 40) + 20,
            y: Math.random() * (canvas.height - 40) + 20,
            radius: 20,
            speedX: 2,
            speedY: 2
        };

        function gameLoop() {
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            
            target.x += target.speedX;
            target.y += target.speedY;

            
            if (target.x - target.radius < 0 || target.x + target.radius > canvas.width) {
                target.speedX = -target.speedX;
            }
            
            if (target.y - target.radius < 0 || target.y + target.radius > canvas.height) {
                target.speedY = -target.speedY;
            }

            
            ctx.beginPath();
            ctx.arc(target.x, target.y, target.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ff4757';
            ctx.fill();
            ctx.closePath();

            
            requestAnimationFrame(gameLoop);
        }

        
        canvas.addEventListener('click', function(event) {
            const rect = canvas.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const clickY = event.clientY - rect.top;

            const distance = Math.hypot(clickX - target.x, clickY - target.y);

            if (distance < target.radius) {
                score += 1;
                scoreBoard.innerText = score;

                target.x = Math.random() * (canvas.width - 40) + 20;
                target.y = Math.random() * (canvas.height - 40) + 20;
                
                target.speedX *= 1.1;
                target.speedY *= 1.1;
            }
        });

        
        gameLoop();
    </script>
</body>
</html>
